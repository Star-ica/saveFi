<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>SaveFi — Community Savings</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#17241f;--mut:#667a72;--line:#e3e0d5;--brand:#0f9d6c;--brand-ink:#fff;--gold:#e9a825;--bad:#d1453b;--soft:#e8f5ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1714;--card:#16231e;--ink:#e8f1ed;--mut:#8fa59c;--line:#263832;--soft:#143328;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1714;--card:#16231e;--ink:#e8f1ed;--mut:#8fa59c;--line:#263832;--soft:#143328;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;padding:10px 18px;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;color:var(--brand)}nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav a{padding:6px 10px;border-radius:8px;color:var(--mut)}nav a.on,nav a:hover{background:var(--soft);color:var(--ink)}
main{max-width:1050px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:30px;margin:.2em 0}h2{font-size:20px;margin:1.2em 0 .5em}h3{margin:.2em 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.grid .card{margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.mut{color:var(--mut);font-size:13px}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:var(--soft);color:var(--ink)}.btn.bad{background:var(--bad)}.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{background:var(--soft);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600}.pill.gold{background:var(--gold);color:#201600}.pill.bad{background:var(--bad);color:#fff}
.bar{height:9px;background:var(--line);border-radius:9px;overflow:hidden;margin:10px 0 6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--gold))}
.av{display:inline-flex;width:30px;height:30px;border-radius:50%;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;border:2px solid var(--card);margin-right:-8px}
.avs{margin-top:10px;padding-left:2px}.hero{padding:44px 24px;border-radius:20px;background:linear-gradient(135deg,var(--brand),#0b6e4c);color:#fff;margin-bottom:18px}
.hero h1{font-size:38px}.hero .btn{background:#fff;color:#0b6e4c}.hero .btn.alt{background:rgba(255,255,255,.18);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.stats div{background:var(--soft);border-radius:12px;padding:10px 12px}.stats b{display:block;font-size:19px}
label{display:block;font-weight:600;margin:10px 0 3px;font-size:13px}input,select{width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.f2{grid-template-columns:1fr}.hero h1{font-size:28px}}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.cell{display:inline-flex;width:26px;height:26px;border-radius:7px;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.ok{background:var(--brand);color:#fff}.due{background:var(--gold);color:#201600}.miss{background:var(--bad);color:#fff}.fut{background:var(--line);color:var(--mut)}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:3px solid var(--line)}.tl li{position:relative;padding:0 0 16px 14px}.tl li:before{content:"";position:absolute;left:-26px;top:4px;width:13px;height:13px;border-radius:50%;background:var(--line);border:3px solid var(--card)}
.tl li.done:before{background:var(--brand)}.tl li.next:before{background:var(--gold)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;display:none;z-index:9;max-width:90%}
.copy{font-family:ui-monospace,monospace;font-size:12px;word-break:break-all;background:var(--bg);padding:8px;border-radius:8px;border:1px dashed var(--line)}
</style></head><body>
<header><a class="logo" href="#/">◎ SaveFi</a><nav id="nav"></nav><div id="wallet" class="row"></div></header>
<main id="app"></main><div id="toast"></div>
<script>
const DAY=86400,FREQ={Daily:DAY,Weekly:7*DAY,"Bi-weekly":14*DAY,Monthly:30*DAY};
const S={me:null,clock:0,live:false,cs:[],cfg:{factory:"",usdt:"",bot:""}};
const now=()=>Math.floor(Date.now()/1000)+S.clock,req=(c,m)=>{if(!c)throw new Error(m)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sh=a=>a?a.slice(0,6)+"…"+a.slice(-4):"—",$=s=>document.querySelector(s);
const fd=t=>new Date(t*1000).toLocaleDateString(undefined,{month:"short",day:"numeric"});
const fname=p=>Object.keys(FREQ).find(k=>FREQ[k]===p)||Math.round(p/DAY)+"-day";
const mkAddr=i=>{let h="",x=i*7919+13;while(h.length<40){x=(Math.imul(x,1103515245)+12345)>>>0;h+=x.toString(16).padStart(8,"0")}return"0x"+h.slice(0,40)};
const av=a=>{const h=parseInt(a.slice(2,6),16)%360;return`<span class="av" title="${a}" style="background:linear-gradient(135deg,hsl(${h} 65% 52%),hsl(${(h+50)%360} 70% 40%))">${a.slice(2,4).toUpperCase()}</span>`};
const cur=c=>c.state!=="Active"?0:Math.min(Math.floor((now()-c.start)/c.period),c.rounds-1);
const dl=(c,r)=>c.start+(r+1)*c.period;
const cellState=(c,a,r)=>{const m=c.mem[a];if(m.paid[r])return"ok";if(c.state!=="Active"||r>cur(c))return"fut";return now()>dl(c,r)+c.grace?"miss":"due"};
const owed=(c,a)=>c.state==="Active"?Array.from({length:cur(c)+1},(_,r)=>r).filter(r=>!c.mem[a].paid[r]).length:0;
function progress(c){if(c.state==="Open")return Math.round(100*c.members.length/c.max);
 if(c.mode==="Goal")return Math.min(100,Math.round(100*c.total/c.goal));
 let n=0;c.members.forEach(a=>{for(let r=0;r<c.rounds;r++)if(c.mem[a].paid[r])n++});return Math.round(100*n/(c.max*c.rounds))}
/* ───────── Demo chain: mirrors the Solidity rules in JS ───────── */
const D={cs:[],pots:[],f(id){return this.cs.find(c=>c.id===id)},pf(id){return this.pots.find(c=>c.id===id)},
createPot(p){const c={...p,id:mkAddr(200+this.pots.length),owner:S.me,state:"Active",contribs:{},total:0,withdrawn:0};this.pots.push(c);return c.id},
potContribute(id,a){const c=this.pf(id);req(c.state==="Active","Pot is closed");req(a>0&&a>=c.min,"Below the minimum contribution ("+c.min+")");c.contribs[S.me]=(c.contribs[S.me]||0)+a;c.total+=a},
potWithdraw(id){const c=this.pf(id);req(S.me===c.owner,"Only the pot owner can withdraw");req(c.state==="Active","Pot is closed");req(c.total>=c.target||now()>=c.unlock,"Locked until the target is reached or the unlock date passes");req(c.total-c.withdrawn>0,"Nothing left to withdraw");c.withdrawn=c.total},
potCancel(id){const c=this.pf(id);req(S.me===c.owner,"Only the pot owner");req(c.state==="Active"&&c.total<c.target&&now()<c.unlock&&c.withdrawn===0,"Cannot cancel now");c.state="Cancelled"},
potRefund(id){const c=this.pf(id),a=c.contribs[S.me]||0;req(c.state==="Cancelled"&&a>0,"Nothing to refund");c.contribs[S.me]=0},
create(p){const c={...p,id:mkAddr(100+this.cs.length),admin:S.me,state:"Open",start:0,members:[],mem:{},nextPayout:0,payouts:[],pool:0,total:0,paused:false,claim:{},rp:{},settled:{},invited:{}};this.cs.push(c);return c.id},
join(id){const c=this.f(id);req(c.state==="Open"&&!c.paused,"Circle is not open");req(!c.mem[S.me],"Already a member");req(c.members.length<c.max,"Circle is full");req(!c.inviteOnly||c.invited[S.me]||S.me===c.admin,"Invite only");
 c.members.push(S.me);c.mem[S.me]={paid:{},deposit:c.amount*c.depositRounds,used:0,received:0,missed:0,late:0,bal:0,active:true};
 if(c.members.length===c.max){c.state="Active";c.start=now()}},
contribute(id,r){const c=this.f(id),m=c.mem[S.me];req(c.state==="Active"&&!c.paused,"Circle not active");req(m&&m.active,"Not a member");req(r<=cur(c),"Round not open yet");req(!m.paid[r],"Already contributed this round");
 let fee=0;if(now()>dl(c,r)){fee=c.amount*c.lateFeeBps/1e4;m.late++}
 m.paid[r]=true;c.total+=c.amount;c.pool+=c.amount+fee;
 if(c.mode==="Goal")m.bal+=c.amount;else if(c.settled[r]){const rc=c.members[r];c.claim[rc]=(c.claim[rc]||0)+c.amount+fee;c.mem[rc].received+=c.amount+fee}else c.rp[r]=(c.rp[r]||0)+c.amount+fee},
leave(id){const c=this.f(id),m=c.mem[S.me];req(m&&m.active,"Not a member");
 if(c.state==="Open"){c.members=c.members.filter(a=>a!==S.me);delete c.mem[S.me]}
 else if(c.state==="Active"&&c.mode==="Goal"){const early=now()<c.start+c.rounds*c.period&&c.total<c.goal;const pen=early?m.bal*c.penalty/1e4:0;c.pool-=m.bal-pen;m.bal=0;m.active=false}
 else throw new Error("Rotating circles are committed once started")},
pause(id){const c=this.f(id);req(S.me===c.admin,"Admin only");c.paused=!c.paused},
cancel(id){const c=this.f(id);req(S.me===c.admin,"Admin only");req(c.state==="Open"||c.paused,"Pause an active circle first");c.state="Cancelled"},
invite(id,a){const c=this.f(id);req(S.me===c.admin,"Admin only");c.invited[a]=true}};
function seed(){const A=Array.from({length:8},(_,i)=>mkAddr(i+1));S.ids=A;const as=(a,f)=>{S.me=a;return f()};
 S.clock=-10*DAY;const a=as(A[0],()=>D.create({name:"Ajo Builders Circle",mode:"Goal",token:"USDT",amount:50,period:7*DAY,grace:DAY,rounds:8,lateFeeBps:500,depositRounds:0,max:5,goal:2000,penalty:1000,inviteOnly:false}));
 A.slice(0,5).forEach(x=>as(x,()=>D.join(a)));A.slice(0,4).forEach(x=>as(x,()=>D.contribute(a,0)));
 S.clock=0;A.slice(0,3).forEach(x=>as(x,()=>D.contribute(a,1)));
 S.clock=-35*DAY;const g=as(A[2],()=>D.create({name:"Rent & Emergency Vault",mode:"Goal",token:"BOT",amount:100,period:30*DAY,grace:3*DAY,rounds:6,lateFeeBps:300,depositRounds:0,max:4,goal:2000,penalty:1000,inviteOnly:false}));
 A.slice(2,6).forEach(x=>as(x,()=>D.join(g)));A.slice(2,6).forEach(x=>as(x,()=>D.contribute(g,0)));S.clock=0;A.slice(2,5).forEach(x=>as(x,()=>D.contribute(g,1)));
 const o=as(A[6],()=>D.create({name:"Campus Cohort Savings",mode:"Goal",token:"BOT",amount:20,period:7*DAY,grace:DAY,rounds:6,lateFeeBps:500,depositRounds:0,max:6,goal:600,penalty:500,inviteOnly:false}));
 [5,6,7].forEach(i=>as(A[i],()=>D.join(o)));S.me=A[1];const pt=D.createPot({name:"Ada’s Laptop Fund",token:"USDT",target:800,unlock:now()+30*DAY,min:5});[[A[0],100],[A[3],50],[A[1],120]].forEach(([x,n])=>{S.me=x;D.potContribute(pt,n)});S.me=A[1]}
/* ───────── Live chain (ethers v5) ───────── */
const FABI=["function createCircle((string name,address token,uint256 amount,uint32 period,uint32 grace,uint16 rounds,uint16 lateFeeBps,uint16 earlyExitPenaltyBps,uint8 maxMembers,bool inviteOnly,uint256 goalTarget)) returns (address)","function allCircles() view returns (address[])","function owner() view returns (address)"];
const CABI=["function p() view returns (string name,address token,uint256 amount,uint32 period,uint32 grace,uint16 rounds,uint16 lateFeeBps,uint16 earlyExitPenaltyBps,uint8 maxMembers,bool inviteOnly,uint256 goalTarget)","function admin() view returns (address)","function state() view returns (uint8)","function startTime() view returns (uint256)","function nextPayout() view returns (uint16)","function pool() view returns (uint256)","function totalContributed() view returns (uint256)","function paused() view returns (bool)","function getMembers() view returns (address[])","function paid(uint256,address) view returns (bool)","function mem(address) view returns (bool active,uint256 deposit,uint256 used,uint256 contributed,uint256 received,uint256 bal,uint16 missed,uint16 late,bool refunded)","function join(id){const c=S.cs.find(x=>x.id===id);if(!c)return"<p>Circle not found.</p>";const link=location.origin+location.pathname+"#/join/"+id,m=c.mem[S.me];
 return`<h1>Join “${esc(c.name)}”</h1><div class="card"><div class="stats"><div><b>${c.amount} ${c.token}</b>per ${fname(c.period).toLowerCase()} round</div><div><b>${c.members.length}/${c.max}</b>members</div><div><b>${c.goal} ${c.token}</b>shared goal</div><div><b>${c.lateFeeBps/100}%</b>late fee</div></div>
<p>Contributions go to a shared vault. You can withdraw your savings once the goal is reached or the term ends (${c.rounds} rounds); leaving earlier forfeits ${c.penalty/100}%, shared with the members who stay. A payment after its deadline pays the late fee.</p>
<p class="mut">Joining wallet: <b>${sh(S.me)}</b></p>${m?'<p class="pill">You are already a member</p>':`<button class="btn" data-a="join" data-id="${id}" ${c.state!=="Open"?"disabled":""}>Join with my wallet</button>`}<h3 style="margin-top:16px">Invite link</h3><div class="copy">${link}</div></div>`}
/* ───────── Actions ───────── */
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",3500)};
async function act(name,id,arg){try{if(S.live){req(!/^pot|Pot$/.test(name),"Personal pots are demo-only in the UI for now; the SavingsPot contract is ready to call directly");await liveAct(name,id,arg)}else{const r=D[name](...((name==="create"||name==="createPot")?[arg]:arg===undefined?[id]:[id,arg]));if(name==="claim")toast("Claimed "+r+" to your wallet")}
 S.cs=await load();if(name==="create"){location.hash="#/discover";return}if(name==="createPot"){location.hash="#/pot/"+D.pots[D.pots.length-1].id;return}toast(({join:"Joined circle",contribute:"Contribution recorded",payout:"Payout scheduled — recipient can now claim",claim:"Claimed",leave:"You left the circle",pause:"Pause toggled",cancel:"Circle cancelled — members can refund",invite:"Wallet invited",potContribute:"Thank you — added to the pot",potWithdraw:"Withdrawn to your wallet",potCancel:"Pot cancelled — contributors can refund",potRefund:"Refund sent",createPot:"Pot created"})[name]||"Done");render()}catch(e){toast(e.reason||e.data?.message||e.message)}}
const load=async()=>S.live?liveLoad():D.cs;
/* ───────── Views ───────── */
const card=c=>{const p=progress(c);return`<a class="card" href="#/circle/${c.id}"><div class="row"><b>${esc(c.name)}</b><span class="pill ${c.mode==="Goal"?"gold":""}">${c.mode}</span></div><div class="mut">${c.amount} ${c.token} · ${fname(c.period)} · ${c.members.length}/${c.max} members</div><div class="bar"><i style="width:${p}%"></i></div><div class="row mut"><span>${c.state}${c.paused?" · paused":""}</span><span>${p}% ${c.state==="Open"?"filled":"saved"}</span></div><div class="avs">${c.members.slice(0,7).map(av).join("")}</div></a>`};
const mine=()=>S.cs.filter(c=>c.mem[S.me]);
function landing(){const tot=S.cs.reduce((s,c)=>s+c.total,0)+D.pots.reduce((s,c)=>s+c.total,0);return`<div class="hero"><h1>Save together. Reach the goal.</h1><p style="max-width:560px">SaveFi brings cooperative saving on-chain: group goal circles with fixed contributions, or a personal pot that friends and family can add to. Rules are enforced by smart contracts — not promises.</p><a class="btn" href="#/create">Create a circle</a> <a class="btn alt" href="#/newpot">Start a personal pot</a> <a class="btn alt" href="#/discover">Browse</a></div>
<div class="stats"><div><b>${S.cs.length}</b>circles</div><div><b>${D.pots.length}</b>personal pots</div><div><b>${tot}</b>contributed (mixed units)</div></div>
<h2>Ways to save</h2><div class="grid"><div class="card"><h3>🎯 Goal circle</h3><p class="mut">A group pools toward a shared target on a schedule. Withdraw once the target is met or the term ends; leaving early costs a penalty shared with those who stay.</p></div><div class="card"><h3>🐷 Personal pot</h3><p class="mut">Saving for one goal? Share your link and others add to your pot. You withdraw when the target or date is reached.</p></div><div class="card"><h3>🛡 Honest by design</h3><p class="mut">Nothing runs by itself — every withdrawal is a transaction you send. Admins can never touch member funds.</p></div></div>`}
function discover(q={}){const t=(q.s||"").toLowerCase(),list=S.cs.filter(c=>(!q.t||c.token===q.t)&&c.name.toLowerCase().includes(t));
 return`<h1>Discover</h1><div class="f2"><div><input id="fs" placeholder="Search by name" value="${esc(q.s||"")}"></div><div><select id="ft"><option value="">BOT &amp; USDT</option><option ${q.t==="BOT"?"selected":""}>BOT</option><option ${q.t==="USDT"?"selected":""}>USDT</option></select></div></div><h2>Goal circles</h2><div class="grid">${list.map(card).join("")||'<p class="mut">No circles match.</p>'}</div><h2>Personal savings pots</h2><div class="grid">${D.pots.filter(c=>(!q.t||c.token===q.t)&&c.name.toLowerCase().includes(t)).map(potCard).join("")}</div>`}
function create(){return`<h1>Create a savings circle</h1><p><a href="#/newpot"><u>Saving for yourself? Create a personal pot others can add to →</u></a></p><form id="cf" class="card"><div class="f2"><div><label>Circle name</label><input name="name" required maxlength="64" value="Neighbours Savings"></div><div><label>Currency</label><select name="token"><option>USDT</option><option>BOT</option></select></div>
<div><label>Contribution per member per round</label><input name="amount" type="number" min="0.01" step="any" value="50" required></div><div><label>Frequency</label><select name="freq">${Object.keys(FREQ).map(k=>`<option ${k==="Weekly"?"selected":""}>${k}</option>`).join("")}</select></div>
<div><label>Number of members (2–50)</label><input name="max" type="number" min="2" max="50" value="5" required></div><div><label>Duration in rounds</label><input name="rounds" type="number" min="1" max="520" value="8"></div>
<div><label>Shared goal target</label><input name="goal" type="number" min="1" step="any" value="1500"></div><div><label>Grace period (days after deadline)</label><input name="grace" type="number" min="0" value="1"></div>
<div><label>Late fee (%)</label><input name="late" type="number" min="0" max="20" step="0.5" value="5"></div><div><label>Early-exit penalty (%)</label><input name="pen" type="number" min="0" max="50" value="10"></div></div>
<label><input type="checkbox" name="inv" style="width:auto"> Invite only</label><div id="prev" class="mut" style="margin:12px 0"></div><button class="btn">Create circle</button> <span class="mut">${S.live?"Sends a transaction to the factory.":"Demo mode — nothing leaves your browser."}</span></form>`}
function join(id){const c=S.cs.find(x=>x.id===id);if(!c)return"<p>Circle not found.</p>";const link=location.origin+location.pathname+"#/join/"+id,m=c.mem[S.me];
 return`<h1>Join “${esc(c.name)}”</h1><div class="card"><div class="stats"><div><b>${c.amount} ${c.token}</b>per ${fname(c.period).toLowerCase()} round</div><div><b>${c.members.length}/${c.max}</b>members</div><div><b>${c.amount*c.depositRounds} ${c.token}</b>refundable deposit</div><div><b>${c.lateFeeBps/100}%</b>late fee</div></div>
<p>${c.mode==="Rotating"?"You will receive one pot of "+c.amount*c.max+" "+c.token+" in your payout round, order fixed by join order. Missing a payment (after "+Math.round(c.grace/DAY)+" grace day(s)) is covered from your deposit — if the deposit runs out, the pot is short.":"Contributions go to a shared vault with a target of "+c.goal+" "+c.token+". You may withdraw once the target is reached or the term ends; leaving earlier forfeits "+c.penalty/100+"%."}</p>
<p class="mut">Joining wallet: <b>${sh(S.me)}</b></p>${m?'<p class="pill">You are already a member</p>':`<button class="btn" data-a="join" data-id="${id}" ${c.state!=="Open"?"disabled":""}>Join with my wallet</button>`}<h3 style="margin-top:16px">Invite link</h3><div class="copy">${link}</div></div>`}
function circle(id){const c=S.cs.find(x=>x.id===id);if(!c)return"<p>Circle not found.</p>";const m=c.mem[S.me],cr=cur(c),p=progress(c),act=c.state==="Active"&&!c.paused,end=c.start+c.rounds*c.period,open=c.state==="Active"&&(c.total>=c.goal||now()>=end);
 const due=m&&act?Array.from({length:cr+1},(_,r)=>r).filter(r=>!m.paid[r]):[];
 const stats=`<div class="card"><div class="row"><h1>${esc(c.name)}</h1><span><span class="pill gold">Goal circle</span> <span class="pill ${c.paused||c.state==="Cancelled"?"bad":""}">${c.state}${c.paused?" · paused":""}</span></span></div><div class="mut">Admin ${sh(c.admin)} · ${c.token}</div><div class="bar"><i style="width:${p}%"></i></div><div class="stats"><div><b>${c.state==="Open"?c.members.length+"/"+c.max:c.total+" / "+c.goal}</b>${c.state==="Open"?"members joined":c.token+" saved"}</div><div><b>${open?"Unlocked":"Locked"}</b>${open?"withdrawals open":"until goal or "+(c.state==="Active"?fd(end):"term end")}</div><div><b>${c.state==="Active"?"Round "+(cr+1)+"/"+c.rounds:c.state}</b>${c.state==="Active"?"due "+fd(dl(c,cr)):"schedule starts when full"}</div><div><b>${m?m.bal:"—"}</b>your balance</div></div><div class="avs">${c.members.map(av).join("")}</div></div>`;
 const acts=`<div class="card"><h3>Your actions</h3>${!m?`<a class="btn" href="#/join/${id}">Join this circle</a>`:`<div class="row" style="justify-content:flex-start">${due.map(r=>`<button class="btn" data-a="contribute" data-id="${id}" data-r="${r}">Contribute round ${r+1}${now()>dl(c,r)?" (late fee)":""}</button>`).join("")}<button class="btn ${open?"alt":"bad"}" data-a="leave" data-id="${id}" ${c.state==="Completed"||c.state==="Cancelled"||!m.active?"disabled":""}>${open?"Withdraw my savings":c.state==="Active"?"Exit early (penalty "+c.penalty/100+"%)":"Leave circle"}</button></div>${due.length===0&&act?'<p class="mut">You are fully up to date.</p>':""}`}</div>`;
 const cal=`<div class="card"><h3>Contribution calendar</h3><div class="scroll"><table><tr><th>Member</th>${Array.from({length:c.rounds},(_,r)=>`<th>R${r+1}<div class="mut">${c.state==="Active"?fd(dl(c,r)):""}</div></th>`).join("")}<th>Late</th></tr>${c.members.map(a=>`<tr ${a===S.me?'style="background:var(--soft)"':""}><td>${av(a)} &nbsp; ${sh(a)}</td>${Array.from({length:c.rounds},(_,r)=>{const s=cellState(c,a,r);return`<td><span class="cell ${s}">${{ok:"✓",due:"!",miss:"✕",fut:"·"}[s]}</span></td>`}).join("")}<td>${c.mem[a].late}</td></tr>`).join("")}</table></div><p class="mut"><span class="cell ok">✓</span> paid &nbsp;<span class="cell due">!</span> due &nbsp;<span class="cell miss">✕</span> overdue &nbsp;<span class="cell fut">·</span> upcoming</p></div>`;
 const tl=`<div class="card"><h3>Goal timeline</h3><ul class="tl"><li class="${c.total>=c.goal?"done":"next"}">Target ${c.goal} ${c.token} — saved ${c.total}</li><li class="${c.state==="Completed"?"done":""}">Term ends ${c.state==="Active"?fd(end):"after "+c.rounds+" rounds"} — withdrawals open at target or term end</li></ul></div>`;
 const rules=`<div class="card"><h3>Rules</h3><ul><li>Round N deadline: start + N × ${fname(c.period).toLowerCase()} period; ${Math.round(c.grace/DAY)} grace day(s) are shown as “due” before a round turns “overdue”.</li><li>One contribution per member per round; future rounds cannot be paid early.</li><li>Late payment: ${c.lateFeeBps/100}% fee shared with the other savers, and a public late mark.</li><li>Withdraw your own balance once the goal is met or the term ends. Exiting earlier: ${c.penalty/100}% penalty shared with those who stay.</li><li>Admin can pause or cancel but cannot withdraw funds; cancellation refunds balances.</li></ul></div>`;
 return stats+acts+cal+tl+rules}
function dashboard(){const ms=mine(),ps=D.pots.filter(c=>c.owner===S.me);return`<h1>My dashboard</h1><div class="card"><div class="stats"><div><b>${ms.length}</b>circles</div><div><b>${ms.reduce((s,c)=>s+owed(c,S.me),0)}</b>outstanding contributions</div><div><b>${ms.reduce((s,c)=>s+c.mem[S.me].bal,0)}</b>saved in circles</div><div><b>${ps.reduce((s,c)=>s+c.total-c.withdrawn,0)}</b>in my pots</div></div></div><div class="grid">${ms.map(c=>{const o=owed(c,S.me);return card(c).replace("</a>",`<div class="row" style="margin-top:8px">${o?`<span class="pill bad">${o} due</span>`:'<span class="pill">Up to date</span>'}</div></a>`)}).join("")}${ps.map(potCard).join("")}</div>${ms.length+ps.length?"":'<p class="mut">Nothing yet. <a href="#/discover"><u>Discover circles</u></a> or <a href="#/newpot"><u>start a pot</u></a>.</p>'}`}
function history(){const rows=[];mine().forEach(c=>c.members.filter(a=>a===S.me).forEach(a=>{for(let r=0;r<c.rounds;r++){const s=cellState(c,a,r);if(s!=="fut")rows.push(`<tr><td><a href="#/circle/${c.id}"><u>${esc(c.name)}</u></a></td><td>Round ${r+1}</td><td>${fd(dl(c,r))}</td><td>${c.amount} ${c.token}</td><td><span class="cell ${s}">${{ok:"✓",due:"!",miss:"✕"}[s]}</span> ${{ok:"Paid",due:"Due",miss:"Overdue"}[s]}</td></tr>`)}}));
 return`<h1>Contribution history</h1><div class="card scroll"><table><tr><th>Circle</th><th>Round</th><th>Deadline</th><th>Amount</th><th>Status</th></tr>${rows.join("")||'<tr><td colspan="5" class="mut">No contributions yet.</td></tr>'}</table></div>`}

function admin(){const mc=S.cs.filter(c=>c.admin===S.me);
 return`<h1>Admin dashboard</h1><h2>Circles you administer</h2>${mc.map(c=>`<div class="card"><div class="row"><b>${esc(c.name)}</b><span class="pill ${c.paused?"bad":""}">${c.state}${c.paused?" · paused":""}</span></div><div class="row" style="justify-content:flex-start;margin-top:8px"><button class="btn alt" data-a="pause" data-id="${c.id}">${c.paused?"Resume":"Emergency pause"}</button><button class="btn bad" data-a="cancel" data-id="${c.id}" ${c.state==="Open"||c.paused&&c.state==="Active"?"":"disabled"}>Cancel &amp; enable refunds</button><input style="max-width:280px" placeholder="Invite wallet 0x…" data-inv="${c.id}"><button class="btn alt" data-a="invite" data-id="${c.id}">Invite</button></div><p class="mut">Cancelling an active circle requires pausing first. Admin never has access to member funds.</p></div>`).join("")||'<p class="mut">You do not administer any circle with this wallet.</p>'}
<h2>Settings</h2><form id="sf" class="card"><div class="f2"><div><label>Factory address</label><input name="factory" value="${esc(S.cfg.factory)}" placeholder="0x…"></div><div><label>USDT token address</label><input name="usdt" value="${esc(S.cfg.usdt)}" placeholder="0x…"></div><div><label>BOT token address (blank = native coin)</label><input name="bot" value="${esc(S.cfg.bot)}"></div></div><br><button class="btn">Save &amp; use live wallet</button> <button type="button" class="btn alt" id="demo">Back to demo</button></form>
${S.live?"":`<div class="card"><h3>Demo clock</h3><p class="mut">Simulate the passage of time to test deadlines, late fees and misses.</p><button class="btn alt" data-adv="1">+1 day</button> <button class="btn alt" data-adv="7">+7 days</button></div>`}`}
function potCard(c){const p=Math.min(100,Math.round(100*c.total/c.target));return`<a class="card" href="#/pot/${c.id}"><div class="row"><b>${esc(c.name)}</b><span class="pill gold">Pot</span></div><div class="mut">for ${sh(c.owner)} · target ${c.target} ${c.token}</div><div class="bar"><i style="width:${p}%"></i></div><div class="row mut"><span>${c.state}</span><span>${p}% saved</span></div><div class="avs">${Object.keys(c.contribs).slice(0,7).map(av).join("")}</div></a>`}
function newPot(){return`<h1>Create a personal savings pot</h1><form id="pf" class="card"><div class="f2"><div><label>What are you saving for?</label><input name="name" required maxlength="64" value="My savings goal"></div><div><label>Currency</label><select name="token"><option>USDT</option><option>BOT</option></select></div><div><label>Target</label><input name="target" type="number" min="1" step="any" value="500"></div><div><label>Unlock date (days from now)</label><input name="days" type="number" min="1" value="30"></div><div><label>Minimum contribution</label><input name="min" type="number" min="0" step="any" value="5"></div></div><p class="mut">Anyone with the link can add to your pot. You can withdraw once the target is reached or the unlock date passes. Before that you can cancel, and every contributor (you included) refunds their own contribution.</p><button class="btn">Create pot</button></form>`}
function pot(id){const c=D.pf(id);if(!c)return"<p>Pot not found.</p>";const own=S.me===c.owner,p=Math.min(100,Math.round(100*c.total/c.target)),open=c.total>=c.target||now()>=c.unlock,link=location.origin+location.pathname+"#/pot/"+id,mine=c.contribs[S.me]||0,left=c.total-c.withdrawn,cs=Object.entries(c.contribs).sort((a,b)=>b[1]-a[1]);
 return`<div class="card"><div class="row"><h1>${esc(c.name)}</h1><span><span class="pill gold">Pot</span> <span class="pill ${c.state==="Cancelled"?"bad":""}">${c.state}</span></span></div><div class="mut">Savings of ${av(c.owner)} &nbsp;${sh(c.owner)}${own?" (you)":""}</div><div class="bar"><i style="width:${p}%"></i></div><div class="stats"><div><b>${c.total} ${c.token}</b>raised of ${c.target}</div><div><b>${open?"Unlocked":"Locked"}</b>${open?"owner can withdraw":"until target or "+fd(c.unlock)}</div><div><b>${left}</b>available to withdraw</div><div><b>${cs.length}</b>contributors</div></div></div>
<div class="card"><h3>Add to this pot</h3>${c.state==="Active"?`<div class="row" style="justify-content:flex-start"><input id="pamt" type="number" min="${c.min}" step="any" value="${Math.max(c.min,10)}" style="max-width:160px"><button class="btn" data-a="potContribute" data-id="${id}">Contribute ${c.token}</button></div><p class="mut">Contributing as ${sh(S.me)}. Contributions can only be taken back if the owner cancels before unlock.</p>`:'<p class="mut">This pot is closed.</p>'}${c.state==="Cancelled"&&mine>0?`<button class="btn alt" data-a="potRefund" data-id="${id}">Refund my ${mine} ${c.token}</button>`:""}<h3 style="margin-top:14px">Share link</h3><div class="copy">${link}</div></div>
${own?`<div class="card"><h3>Owner actions</h3><div class="row" style="justify-content:flex-start"><button class="btn" data-a="potWithdraw" data-id="${id}" ${open&&c.state==="Active"&&left>0?"":"disabled"}>Withdraw ${left} ${c.token}</button><button class="btn bad" data-a="potCancel" data-id="${id}" ${!open&&c.state==="Active"&&c.withdrawn===0?"":"disabled"}>Cancel &amp; refund contributors</button></div><p class="mut">Withdrawal is a transaction you send yourself; nothing is paid out automatically.</p></div>`:""}
<div class="card"><h3>Contributors</h3>${cs.map(([a,n])=>`<div class="row" style="padding:5px 0">${av(a)}<span style="flex:1;margin-left:14px">${sh(a)}${a===S.me?" (you)":""}</span><b>${n} ${c.token}</b></div>`).join("")||'<p class="mut">No contributions yet.</p>'}</div>`}
/* ───────── Router ───────── */
const NAV=[["","Home"],["discover","Discover"],["create","Create"],["dashboard","Dashboard"],["contributions","Contributions"],["admin","Admin"]];
function header(){const r=(location.hash.slice(2)||"").split("/")[0];$("#nav").innerHTML=NAV.map(([h,t])=>`<a href="#/${h}" class="${r===h?"on":""}">${t}</a>`).join("");
 $("#wallet").innerHTML=S.live?`${av(S.me)}<span class="mut">${sh(S.me)}</span>`:`<span class="pill gold">Demo</span><select id="who" title="Switch demo wallet">${S.ids.map((a,i)=>`<option value="${a}" ${a===S.me?"selected":""}>Wallet ${i+1} · ${sh(a)}</option>`).join("")}</select><button class="btn alt" id="conn">Connect wallet</button>`}
async function render(){header();const[r,id]=(location.hash.slice(2)||"").split("/"),q=Object.fromEntries(new URLSearchParams((location.hash.split("?")[1]||"")));let h;
 try{h=({"":landing,discover:()=>discover(q),create,newpot:newPot,pot:()=>pot(id),join:()=>join(id),circle:()=>circle(id),dashboard,contributions:history,admin}[r]||landing)()}catch(e){h=`<p>Something went wrong: ${esc(e.message)}</p>`}$("#app").innerHTML=h;
 const f=$("#cf");if(f){const pv=()=>{const d=new FormData(f),n=+d.get("max"),a=+d.get("amount"),rd=+d.get("rounds");$("#prev").textContent=`Each member pays ${a} ${d.get("token")} × ${rd} rounds (${rd*FREQ[d.get("freq")]/DAY} days). If everyone pays on time the vault holds ${a*n*rd} vs a target of ${d.get("goal")}.`};f.oninput=pv;pv()}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b){const a=b.dataset.a;let arg=b.dataset.r!==undefined?+b.dataset.r:undefined;if(a==="invite")arg=$(`[data-inv="${b.dataset.id}"]`).value.trim();if(a==="potContribute")arg=+$("#pamt").value;act(a,b.dataset.id,arg);return}
 if(e.target.dataset.adv){S.clock+=+e.target.dataset.adv*DAY;toast("Clock advanced");render();return}
 if(e.target.id==="conn"){liveConnect().then(async()=>{S.cs=await load();toast("Connected "+sh(S.me));render()}).catch(x=>toast(x.message))}
 if(e.target.id==="demo"){S.live=false;S.me=S.ids[1];S.cs=D.cs;render()}});
document.addEventListener("change",e=>{if(e.target.id==="who"){S.me=e.target.value;render()}if(["fs","ft"].includes(e.target.id)){location.hash=`#/discover?s=${encodeURIComponent($("#fs").value)}&t=${$("#ft").value}`}});
document.addEventListener("submit",async e=>{e.preventDefault();const d=new FormData(e.target);
 if(e.target.id==="pf")act("createPot",null,{name:d.get("name"),token:d.get("token"),target:+d.get("target"),unlock:now()+(+d.get("days"))*DAY,min:+d.get("min")});
 if(e.target.id==="cf"){const n=+d.get("max");act("create",null,{name:d.get("name"),mode:"Goal",token:d.get("token"),amount:+d.get("amount"),period:FREQ[d.get("freq")],grace:+d.get("grace")*DAY,rounds:+d.get("rounds"),lateFeeBps:Math.round(+d.get("late")*100),penalty:Math.round(+d.get("pen")*100),depositRounds:0,max:n,goal:+d.get("goal"),inviteOnly:!!d.get("inv")})}
 if(e.target.id==="sf"){S.cfg={factory:d.get("factory").trim(),usdt:d.get("usdt").trim(),bot:d.get("bot").trim()};try{await liveConnect();S.cs=await load();toast("Live mode on");render()}catch(x){toast(x.message)}}});
window.addEventListener("hashchange",render);
seed();S.cs=D.cs;render();
</script></body></html>
